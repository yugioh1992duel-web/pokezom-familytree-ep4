'use strict';
/* =====================================================================
   POKEZOM Ep.4 v2.2 — FINAL VISUAL POLISH PASS (visuals only; the v2.1
   audio mix is APPROVED + LOCKED and is muxed in unchanged).
   Timeline = slice time (62.25s): VO pads at full-sentence stops
   ep 69.34 (+1.35s) and ep 108.25 (+0.90s). All motion is a PURE
   FUNCTION of t (deterministic, seekable). No rAF, no CSS animation.
   v2.2 upgrades: BLACKOUT-UNTIL-REVEAL silhouettes (cold open, creation
   map, guardian tease) with rim-glow separation; deep midnight-obsidian
   palette + saturated elemental blooms; 3-layer sprite lighting stack
   (halo / edge rim-glow / foreground motes); luminous card borders;
   pearlescent cracking egg with light-burst hatch; organic plasma rift;
   Dialga card raised fully above y=880; rift wipe masked (no text
   fragments); guardian row reseated clear of the DISTORTION label.
   ===================================================================== */
const W = 1920, H = 1080, DUR = 62.25;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const IMG = {};
['493','483','484','487','480','481','482'].forEach(n => { IMG[n] = document.getElementById('art' + n); });
const IMGKEY = new Map(); Object.entries(IMG).forEach(([k,v])=>IMGKEY.set(v,k));
/* ---- silhouette / rim-glow sprite variants (blackout-until-reveal) ----
   Lazily derived from the loaded art: slate silhouette (lifted dark fill
   via source-in) + solid accent rim copy used as a blurred edge glow. */
const SILCACHE = {};
function silCanvas(key, fill){
  const img = IMG[key];
  if(!img || !img.complete || !img.naturalWidth) return null;
  const ck = key + '|' + fill;
  if(SILCACHE[ck]) return SILCACHE[ck];
  const cv2 = document.createElement('canvas');
  cv2.width = img.naturalWidth; cv2.height = img.naturalHeight;
  const g = cv2.getContext('2d');
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-in';
  if(fill === 'slate'){
    const gr = g.createLinearGradient(0, 0, 0, cv2.height);
    gr.addColorStop(0, '#2E3A58'); gr.addColorStop(1, '#1B2338');
    g.fillStyle = gr;
  } else g.fillStyle = fill;
  g.fillRect(0, 0, cv2.width, cv2.height);
  SILCACHE[ck] = cv2;
  return cv2;
}
/* Blacked-out mystery shape: accent rim-glow halo + lifted slate body. */
function drawSilhouette(c, key, cx, cy, size, accent, alpha=1){
  const sil = silCanvas(key, 'slate'), rim = silCanvas(key, accent);
  if(!sil || !rim) return;
  c.save(); c.globalAlpha *= alpha;
  c.save();
  c.shadowColor = accent; c.shadowBlur = 30;
  c.drawImage(rim, cx - size/2, cy - size/2, size, size);
  c.drawImage(rim, cx - size/2, cy - size/2, size, size);
  c.restore();
  c.drawImage(sil, cx - size/2, cy - size/2, size, size);
  c.restore();
}

const PAL = {
  plate:'#17181D', offWhite:'#EDEDED', silver:'#B4BCC6',
  gold:'#E6B84C', goldBright:'#F4D58D', goldSpec:'#FFD000',
  cyan:'#4BC8E8', cyanSpec:'#38BDF8', magenta:'#E0569B', crimson:'#E53946',
  crimsonSpec:'#FF3B5C', violet:'#7E3AF2',
  goldVivid:'#FFD84D', goldHot:'#FFF3B0', cyanVivid:'#00E5FF', blueDeep:'#3B82F6',
  magentaVivid:'#FF3CAC', magentaDeep:'#D946EF', crimsonVivid:'#FF1E56',
  ultraViolet:'#9D00FF', slateSil:'#26304A',
  badges:{
    normal:{bg:'#D4D2C5',fg:'#121212',border:'#EAE8DC'},
    steel:{bg:'#B8C2CC',fg:'#121212',border:'#D7E0E8'},
    dragon:{bg:'#4F3A9E',fg:'#EDEDED',border:'#7560C4'},
    water:{bg:'#2B6CB0',fg:'#EDEDED',border:'#4E8FD4'},
    ghost:{bg:'#533A7B',fg:'#EDEDED',border:'#7B5DA8'},
    canon:{bg:'#2C1B12',fg:'#E6B84C',border:'#E6B84C'},
    implied:{bg:'#23262D',fg:'#EDEDED',border:'#B4BCC6'},
    theory:{bg:'#1D1430',fg:'#C4A6F5',border:'#7E3AF2'}
  }
};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const norm=(t,s,e)=>clamp((t-s)/(e-s),0,1);
const easeOutCubic=x=>1-Math.pow(1-x,3);
const easeInOutCubic=x=>(x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2);
const easeOutQuart=x=>1-Math.pow(1-x,4);
const easeOutExpo=x=>(x===1?1:1-Math.pow(2,-10*x));
function cubicBezierPoint(p0,p1,p2,p3,t){
  const u=1-t,tt=t*t,uu=u*u,uuu=uu*u,ttt=tt*t;
  return {x:uuu*p0.x+3*uu*t*p1.x+3*u*tt*p2.x+ttt*p3.x,
          y:uuu*p0.y+3*uu*t*p1.y+3*u*tt*p2.y+ttt*p3.y};
}
function createSeededRandom(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function textW(c,txt,font){ c.font=font; return c.measureText(txt).width; }

/* ---- deterministic particle fields ---- */
const rand = createSeededRandom(40125);
const starsFar = Array.from({length:150},()=>({
  x:rand()*W, y:rand()*H, r:0.8+rand()*1.7, phase:rand()*Math.PI*2, tw:0.5+rand()*1.6
}));
const starsNear = Array.from({length:60},()=>({
  x:rand()*W, y:rand()*H, r:1.6+rand()*2.2, speed:9+rand()*13, phase:rand()*Math.PI*2
}));
const embers = Array.from({length:85},(_,i)=>({
  x:rand()*W, y:rand()*H, radius:1.4+rand()*3.2, speedY:10+rand()*24,
  driftX:(rand()-0.5)*18, phase:rand()*Math.PI*2, alpha:0.16+rand()*0.48,
  isCrimson:i%4===0
}));
const shards = Array.from({length:30},(_,i)=>{
  const angle=(i/22)*Math.PI*2+(rand()-0.5)*0.35;
  return { baseX:1300+Math.cos(angle)*(250+rand()*320), baseY:560+Math.sin(angle)*(110+rand()*130),
    size:16+rand()*36, rot:rand()*Math.PI*2, rotSpeed:(rand()-0.5)*0.55,
    bobAmp:8+rand()*15, phase:rand()*Math.PI*2, sides:3+Math.floor(rand()*3),
    near:i%2===0, rimColor:i%2===0?PAL.crimson:PAL.violet };
});
const eggMotes = Array.from({length:36},(_,i)=>({
  ang:rand()*Math.PI*2, rad:150+rand()*130, speed:(0.25+rand()*0.5)*(i%2?1:-1),
  size:1.6+rand()*2.6, phase:rand()*Math.PI*2
}));
/* film grain: 4 seeded noise tiles, cycled by frame index (deterministic) */
const grainTiles=[], grainPats=[];
(function(){
  const gr=createSeededRandom(777);
  for(let k=0;k<4;k++){
    const tc=document.createElement('canvas'); tc.width=tc.height=256;
    const tg=tc.getContext('2d'); const id=tg.createImageData(256,256);
    for(let i=0;i<id.data.length;i+=4){
      const v=Math.floor(gr()*255);
      id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255;
    }
    tg.putImageData(id,0,0);
    grainTiles.push(tc); grainPats.push(ctx.createPattern(tc,'repeat'));
  }
})();
/* nebula haze blobs (organic depth, slow parallax drift) */
const nebula=[
  {x:480,y:280,r:720,color:'#FFD84D',a:0.085,ph:0.0,sp:0.11,dx:46,dy:26},
  {x:1500,y:720,r:820,color:'#9D00FF',a:0.095,ph:2.1,sp:0.08,dx:38,dy:30},
  {x:1020,y:920,r:640,color:'#00E5FF',a:0.062,ph:4.2,sp:0.13,dx:52,dy:20},
  {x:300,y:980,r:520,color:'#FF1E56',a:0.050,ph:1.2,sp:0.09,dx:30,dy:22}
];

/* ---- drawing primitives ---- */
function drawRoundedRect(c,x,y,w,h,r){
  const radius=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+radius,y); c.lineTo(x+w-radius,y); c.quadraticCurveTo(x+w,y,x+w,y+radius);
  c.lineTo(x+w,y+h-radius); c.quadraticCurveTo(x+w,y+h,x+w-radius,y+h);
  c.lineTo(x+radius,y+h); c.quadraticCurveTo(x,y+h,x,y+h-radius);
  c.lineTo(x,y+radius); c.quadraticCurveTo(x,y,x+radius,y); c.closePath();
}
/* Type/verification pill — 46px JetBrains Mono (cap height ~33.5px), height 68. Returns width. */
const BADGE_FONT='700 46px "JetBrains Mono", monospace';
function badgeWidth(c,text){ return Math.ceil(textW(c,text,BADGE_FONT)+52); }
function drawTypeBadge(c,text,x,y,styleObj,align='left'){
  c.save();
  c.font=BADGE_FONT;
  const pillW=badgeWidth(c,text), pillH=68;
  const drawX=align==='center'?x-pillW/2:align==='right'?x-pillW:x;
  drawRoundedRect(c,drawX,y,pillW,pillH,14);
  c.fillStyle=styleObj.bg; c.fill();
  c.lineWidth=2.5; c.strokeStyle=styleObj.border; c.stroke();
  c.fillStyle=styleObj.fg; c.textAlign='center'; c.textBaseline='middle';
  c.fillText(text,drawX+pillW/2,y+pillH/2+2);
  c.restore();
  return pillW;
}
/* Obsidian glass editorial card. jagged=true swaps the accent bar for a torn strip. */
function drawEditorialCard(c,x,y,w,h,accentColor,alpha=1,jagged=false){
  c.save(); c.globalAlpha*=alpha;
  c.shadowColor='rgba(0,0,0,0.72)'; c.shadowBlur=32; c.shadowOffsetY=12;
  drawRoundedRect(c,x,y,w,h,16);
  const grad=c.createLinearGradient(x,y,x+w,y+h);
  grad.addColorStop(0,'#1B1D23'); grad.addColorStop(1,'#131418');
  c.fillStyle=grad; c.fill();
  c.shadowColor='transparent'; c.shadowBlur=0; c.shadowOffsetY=0;
  /* luminous accent border + inner specular rim (v2.2 premium frame) */
  c.lineWidth=2.5; c.strokeStyle=hexA(accentColor,0.62); c.stroke();
  drawRoundedRect(c,x+4,y+4,w-8,h-8,13);
  c.lineWidth=1.5; c.strokeStyle='rgba(255,255,255,0.09)'; c.stroke();
  const specG=c.createLinearGradient(x,y,x+w,y);
  specG.addColorStop(0,'rgba(255,255,255,0)');
  specG.addColorStop(0.5,'rgba(255,255,255,0.20)');
  specG.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=specG; c.fillRect(x+18,y+1.5,w-36,2);
  if(jagged){
    c.beginPath();
    const seg=7, x0=x, wBar=8;
    c.moveTo(x0+2,y+16);
    for(let i=1;i<=seg;i++){
      const yy=y+16+(h-32)*i/seg;
      c.lineTo(x0+2+(i%2?wBar:2),yy);
    }
    c.lineTo(x0+2,y+h-16); c.closePath();
    c.fillStyle=accentColor; c.fill();
  } else {
    drawRoundedRect(c,x,y+14,7,h-28,4); c.fillStyle=accentColor; c.fill();
  }
  c.restore();
}
function drawMedallionBase(c,cx,cy,r,accentColor,t,alpha=1){
  c.save(); c.globalAlpha*=alpha;
  const aura=c.createRadialGradient(cx,cy,r*0.25,cx,cy,r*2.15);
  aura.addColorStop(0,hexA(accentColor,0.33)); aura.addColorStop(0.55,hexA(accentColor,0.09));
  aura.addColorStop(1,'rgba(11,13,18,0)');
  c.fillStyle=aura; c.beginPath(); c.arc(cx,cy,r*2.15,0,Math.PI*2); c.fill();
  c.save(); c.translate(cx,cy); c.rotate(t*0.25);
  c.strokeStyle=hexA(accentColor,0.47); c.lineWidth=2.5; c.setLineDash([12,10]);
  c.beginPath(); c.arc(0,0,r+13,0,Math.PI*2); c.stroke(); c.setLineDash([]); c.restore();
  const coreGrad=c.createRadialGradient(cx-r*0.25,cy-r*0.25,r*0.1,cx,cy,r);
  coreGrad.addColorStop(0,'#23252E'); coreGrad.addColorStop(1,'#121317');
  c.fillStyle=coreGrad; c.beginPath(); c.arc(cx,cy,r,0,Math.PI*2); c.fill();
  c.lineWidth=3.5; c.strokeStyle=accentColor; c.stroke();
  c.lineWidth=1.5; c.strokeStyle='rgba(237,237,237,0.18)';
  c.beginPath(); c.arc(cx,cy,r-8,0,Math.PI*2); c.stroke();
  c.restore();
}
function drawNodeArt(c,img,cx,cy,r,alpha=1,dim=0){
  c.save(); c.globalAlpha*=alpha;
  c.beginPath(); c.arc(cx,cy,r-6,0,Math.PI*2); c.clip();
  const s=(r-6)*2;
  c.drawImage(img,cx-s/2,cy-s/2,s,s);
  if(dim>0){ c.fillStyle=`rgba(8,9,13,${dim})`; c.fillRect(cx-r,cy-r,r*2,r*2); }
  c.restore();
}
/* Hero art: volumetric rim glow + optional astrolabe ring (Arceus only). */
function drawHeroArt(c,img,cx,cy,size,accent,t,alpha=1,phase=0,ringStyle='none',rimColor=null){
  c.save(); c.globalAlpha*=alpha;
  const bobY=Math.sin(t*0.9+phase)*7;
  const breathe=1+0.012*Math.sin(t*0.7+phase);
  const yy=cy+bobY, ss=size*breathe;
  const haloCol = rimColor || accent;
  const aura=c.createRadialGradient(cx,yy,size*0.1,cx,yy,size*1.12);
  aura.addColorStop(0,hexA(haloCol,0.50)); aura.addColorStop(0.55,hexA(haloCol,0.17));
  aura.addColorStop(1,'rgba(11,13,18,0)');
  c.fillStyle=aura; c.beginPath(); c.arc(cx,yy,size*1.12,0,Math.PI*2); c.fill();
  /* edge rim-glow: blurred accent silhouette hugs the sprite's outline */
  if(rimColor){
    const rimCv = silCanvas(IMGKEY.get(img), rimColor);
    if(rimCv){
      c.save();
      c.shadowColor=rimColor; c.shadowBlur=30; c.globalAlpha*=0.92;
      c.drawImage(rimCv,cx-ss/2,yy-ss/2,ss,ss);
      c.drawImage(rimCv,cx-ss/2,yy-ss/2,ss,ss);
      c.restore();
    }
  }
  if(ringStyle==='astrolabe'){
    c.save(); c.translate(cx,yy); c.rotate(t*0.18);
    c.strokeStyle=hexA(accent,0.5); c.lineWidth=3; c.setLineDash([16,12]);
    c.beginPath(); c.arc(0,0,size*0.60,0,Math.PI*2); c.stroke(); c.setLineDash([]); c.restore();
    c.strokeStyle=hexA(accent,0.85); c.lineWidth=2.5;
    c.beginPath(); c.arc(cx,yy,size*0.565,0,Math.PI*2); c.stroke();
  }
  c.save();
  c.shadowColor='rgba(0,0,0,0.65)'; c.shadowBlur=30; c.shadowOffsetY=16;
  c.drawImage(img,cx-ss/2,yy-ss/2,ss,ss);
  c.restore();
  c.restore();
}
function drawLineageThread(c,p0,p1,p2,p3,color,progress,t,alpha=1){
  if(progress<=0.001) return;
  c.save(); c.globalAlpha*=alpha;
  const steps=48, maxStep=Math.floor(steps*progress);
  c.beginPath();
  for(let i=0;i<=maxStep;i++){
    const pt=cubicBezierPoint(p0,p1,p2,p3,i/steps);
    if(i===0)c.moveTo(pt.x,pt.y); else c.lineTo(pt.x,pt.y);
  }
  c.strokeStyle=hexA(color,0.27); c.lineWidth=10; c.lineCap='round'; c.stroke();
  c.strokeStyle=color; c.lineWidth=3.2; c.stroke();
  if(progress<0.99){
    const head=cubicBezierPoint(p0,p1,p2,p3,progress);
    c.fillStyle='#EDEDED'; c.shadowColor=color; c.shadowBlur=18;
    c.beginPath(); c.arc(head.x,head.y,6,0,Math.PI*2); c.fill(); c.shadowBlur=0;
  }
  if(progress>0.35){
    for(let p=0;p<2;p++){
      const pulseT=(t*0.42+p*0.5)%1;
      if(pulseT<=progress){
        const pt=cubicBezierPoint(p0,p1,p2,p3,pulseT);
        const grad=c.createRadialGradient(pt.x,pt.y,1,pt.x,pt.y,18);
        grad.addColorStop(0,'#EDEDED'); grad.addColorStop(0.35,color); grad.addColorStop(1,'rgba(0,0,0,0)');
        c.fillStyle=grad; c.beginPath(); c.arc(pt.x,pt.y,18,0,Math.PI*2); c.fill();
      }
    }
  }
  c.restore();
}
/* expanding pulse rings (stage VFX) */
function fxPulseRings(color,speed,spacing,maxR=330){
  return (c,t,cx,cy)=>{
    c.save();
    for(let k=0;k<3;k++){
      const r=((t*speed+k*spacing)%maxR);
      const a=(1-r/maxR)*0.34;
      if(a<=0) continue;
      c.strokeStyle=hexA(color,a); c.lineWidth=2.5;
      c.beginPath(); c.arc(cx,cy,r,0,Math.PI*2); c.stroke();
    }
    c.restore();
  };
}

/* foreground depth motes: drift IN FRONT of hero sprites (layer c) */
const fgMotes = Array.from({length:30},(_,i)=>({
  x:rand()*W, y:rand()*H, r:1.3+rand()*3.1, sp:14+rand()*26,
  drift:(rand()-0.5)*22, phase:rand()*Math.PI*2, big:i%6===0
}));
function drawFgMotes(c,t,color,alpha=1){
  c.save();
  for(const m of fgMotes){
    const py=(m.y - t*m.sp + H*4)%H;
    const px=(m.x + Math.sin(t*0.6+m.phase)*30 + t*m.drift + W*4)%W;
    if(py < H*0.30) continue; /* concentrate on the lower two-thirds */
    const tw=0.35+0.65*(0.5+0.5*Math.sin(t*2.1+m.phase));
    c.globalAlpha=alpha*tw*(m.big?0.5:0.75);
    if(m.big){
      const g=c.createRadialGradient(px,py,0.5,px,py,m.r*5);
      g.addColorStop(0,hexA(color,0.5)); g.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=g; c.beginPath(); c.arc(px,py,m.r*5,0,Math.PI*2); c.fill();
    } else {
      c.fillStyle=color;
      c.beginPath(); c.arc(px,py,m.r,0,Math.PI*2); c.fill();
    }
  }
  c.restore();
}

/* ---- vector emblems (showcase ports) ---- */
function drawArceusEmblem(c,cx,cy,scale,t,alpha=1){
  c.save(); c.globalAlpha*=alpha; c.translate(cx,cy); c.scale(scale,scale);
  c.strokeStyle=PAL.gold; c.lineWidth=4.5;
  c.beginPath(); c.arc(0,0,34,0,Math.PI*2); c.stroke();
  c.fillStyle=PAL.goldBright;
  for(let i=0;i<4;i++){
    c.save(); c.rotate((i*Math.PI)/2);
    c.beginPath(); c.moveTo(0,-48); c.lineTo(8,-14); c.lineTo(0,-6); c.lineTo(-8,-14); c.closePath(); c.fill(); c.restore();
  }
  const pulse=0.78+0.22*Math.sin(t*3.5);
  for(let i=0;i<4;i++){
    const ang=(i*Math.PI)/2+Math.PI/4, jx=Math.cos(ang)*34, jy=Math.sin(ang)*34;
    c.fillStyle='#34D399'; c.globalAlpha=alpha*pulse;
    c.beginPath(); c.arc(jx,jy,4.5,0,Math.PI*2); c.fill();
    c.globalAlpha=alpha; c.strokeStyle=PAL.goldBright; c.lineWidth=2; c.stroke();
  }
  c.fillStyle='#121212'; c.strokeStyle=PAL.gold; c.lineWidth=3;
  c.beginPath(); c.moveTo(0,-11); c.lineTo(11,0); c.lineTo(0,11); c.lineTo(-11,0); c.closePath(); c.fill(); c.stroke();
  c.restore();
}
function drawDialgaEmblem(c,cx,cy,scale,t,alpha=1){
  c.save(); c.globalAlpha*=alpha; c.translate(cx,cy); c.scale(scale,scale);
  c.strokeStyle=PAL.cyan; c.lineWidth=3.5;
  c.beginPath(); c.arc(0,0,38,0,Math.PI*2); c.stroke();
  for(let i=0;i<12;i++){
    const ang=(i/12)*Math.PI*2, inner=i%3===0?27:31;
    c.strokeStyle=i%3===0?'#EDEDED':PAL.cyan; c.lineWidth=i%3===0?3:2;
    c.beginPath(); c.moveTo(Math.cos(ang)*inner,Math.sin(ang)*inner);
    c.lineTo(Math.cos(ang)*37,Math.sin(ang)*37); c.stroke();
  }
  c.strokeStyle='#EDEDED'; c.lineWidth=3.2; c.lineCap='round';
  c.beginPath(); c.moveTo(0,0);

/* ---- Giratina rift: jagged dimensional TEAR (plasma core, glowing edges) ---- */
const RIFT_PTS=[{x:1330,y:140},{x:1308,y:240},{x:1346,y:330},{x:1312,y:420},{x:1330,y:505},{x:1278,y:585},{x:1218,y:560},{x:1168,y:650},{x:1118,y:640},{x:1078,y:730}];

function riftEdges(t,open01,surge){
  const L=[],R=[];
  for(let i=0;i<RIFT_PTS.length;i++){
    const p=RIFT_PTS[i];
    const pn=RIFT_PTS[Math.min(i+1,RIFT_PTS.length-1)], pp=RIFT_PTS[Math.max(i-1,0)];
    let dx=pn.x-pp.x, dy=pn.y-pp.y; const m=Math.hypot(dx,dy)||1; dx/=m; dy/=m;

function drawShards(c,t,stageAlpha){

/* Medallion disc + blacked-out sprite + pulsing rim ring (TV-legible
   against the deepened backdrop: lifted slate fill inside the ring). */
function drawNodeSilhouette(c,cx,cy,r,key,accent,t,alpha){
  c.save();
  c.beginPath(); c.arc(cx,cy,r-6,0,Math.PI*2); c.clip();
  drawSilhouette(c,key,cx,cy,(r-6)*2,accent,alpha);
  c.restore();
  const pulse=0.45+0.35*Math.sin(t*2.2+cx*0.01);
  c.save(); c.globalAlpha*=alpha*pulse;
  c.beginPath(); c.arc(cx,cy,r+2,0,Math.PI*2);
  c.strokeStyle=accent; c.lineWidth=3;
  c.shadowColor=accent; c.shadowBlur=12; c.stroke();
  c.restore();
}

function drawMap2(c,t){
  const flare43=Math.sin(Math.PI*norm(t,43.6,44.3));
  mapThreads(c,t,'dim',flare43*0.6);
  drawLineageThread(c,{x:960,y:285},{x:640,y:300},{x:480,y:400},{x:430,y:478},PAL.cyan,easeInOutCubic(norm(t,45.5,46.5)),t,1);

  drawLineageThread(c,{x:960,y:285},{x:930,y:420},{x:990,y:520},{x:960,y:598},PAL.crimson,easeInOutCubic(norm(t,45.8,46.8)),t,1);
  drawMedallionBase(c,MAP.apex.x,MAP.apex.y,72,PAL.gold,t,1);
  drawNodeArt(c,IMG['493'],MAP.apex.x,MAP.apex.y,72,1,0);

  c.font='600 36px "Barlow", sans-serif'; c.fillStyle=PAL.gold;
  c.fillText('THE ORIGINAL ONE',1060,318);

  /* BLACKOUT-UNTIL-REVEAL: silhouettes, then EMPTY medallions holding
     only the golden eggs, then a flash reveal into full color. */
  const lightT=norm(t,46.7,47.15);
  const nodes=[[MAP.dialga,'483',PAL.cyanVivid,'DIALGA','TIME'],[MAP.palkia,'484',PAL.magentaVivid,'PALKIA','SPACE'],[MAP.giratina,'487',PAL.crimsonVivid,'GIRATINA','DISTORTION']];
  const eggHold = t>=44.9 && t<46.7;
  for(const [nd,img,acc,nm,sb] of nodes){
    drawMedallionBase(c,nd.x,nd.y,56,acc,t,0.9);
    if(lightT>0.99){
      drawNodeArt(c,IMG[img],nd.x,nd.y,56,1,0);
    } else if(lightT>0.01){
      drawNodeArt(c,IMG[img],nd.x,nd.y,56,lightT,0);

      c.fillStyle=fg; c.beginPath(); c.arc(nd.x,nd.y,150,0,Math.PI*2); c.fill();
    } else if(eggHold){
      /* empty obsidian core — the golden egg alone occupies the node */
    } else {
      drawNodeSilhouette(c,nd.x,nd.y,56,img,acc,t,0.9);
    }
    if(lightT>0.01){
      c.save(); c.globalAlpha*=lightT;
      c.textAlign='center'; c.textBaseline='alphabetic';
      c.font='800 44px "Barlow Condensed", sans-serif'; c.fillStyle=PAL.offWhite;
      c.fillText(nm,nd.x,nd.y+120);
      c.font='600 36px "Barlow", sans-serif'; c.fillStyle=acc;
      c.fillText(sb,nd.x,nd.y+160);
      c.restore();
    }
  }
  const eggA=norm(t,44.9,45.15)*(1-norm(t,46.55,46.8));
  if(eggA>0.01){
    for(const nd of [MAP.dialga,MAP.palkia,MAP.giratina]){

}

function bandPoly(hw){
  const L=[],R=[];
  for(let i=0;i<RIFT_PTS.length;i++){
    const p=RIFT_PTS[i];
    const pn=RIFT_PTS[Math.min(i+1,RIFT_PTS.length-1)], pp=RIFT_PTS[Math.max(i-1,0)];
    let dx=pn.x-pp.x, dy=pn.y-pp.y; const m=Math.hypot(dx,dy)||1; dx/=m; dy/=m;
    const w=hw*(RIFT_W[i]/52);
    L.push({x:p.x-dy*w, y:p.y+dx*w});
    R.push({x:p.x+dy*w, y:p.y-dx*w});
  }
  return {L,R};
}
/* ============================ SCENE ============================ */
function renderScene(t){
  drawBackground(ctx,t);
  let shX=0, shY=0;
  if(t>=55.95 && t<=56.35){
    const st=(t-55.95)/0.40, decay=Math.exp(-st*6.5);
    shX=Math.sin(st*Math.PI*11)*22*decay;
    shY=Math.cos(st*Math.PI*9)*15*decay;
  }
  if(t>=58.9 && t<=59.12){
    const st=(t-58.9)/0.22, decay=Math.exp(-st*8);
    shX+=Math.sin(st*Math.PI*7)*5*decay;
  }
  ctx.save(); ctx.translate(shX,shY);

  /* ---- MAP1: cold-open constellation (0 - 8.65) ---- */
  if(t<8.65){
    const z=lerp(1.02,1.16,easeInOutCubic(norm(t,0,8.65)));
    const flare=Math.sin(Math.PI*norm(t,5.6,6.5));
    ctx.save();
    ctx.translate(960,430); ctx.scale(z,z); ctx.translate(-960,-430);
    ctx.translate(-26*norm(t,0,8.65),0);
    drawMap(ctx,t,'dim',flare);
    /* motivated cold-open motion: rotating apex astrolabe + ring pulse */
    ctx.save(); ctx.translate(MAP.apex.x,MAP.apex.y); ctx.rotate(t*0.12);
    ctx.strokeStyle='rgba(255,216,77,0.30)'; ctx.lineWidth=2; ctx.setLineDash([10,14]);
    ctx.beginPath(); ctx.arc(0,0,104,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
    if(t>=4.4 && t<5.8){
      const rp=easeOutExpo(norm(t,4.4,5.8));
      ctx.save(); ctx.strokeStyle=`rgba(255,216,77,${(1-rp)*0.55})`; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(MAP.apex.x,MAP.apex.y,80+rp*360,0,Math.PI*2); ctx.stroke(); ctx.restore();
    }
    ctx.restore();
    const chipA=norm(t,2.78,3.4)*(1-norm(t,7.9,8.5));
    if(chipA>0.01){
      ctx.save(); ctx.globalAlpha*=chipA;
      let bx=130;
      bx+=drawTypeBadge(ctx,'CANON',bx,884,PAL.badges.canon,'left')+14;
      bx+=drawTypeBadge(ctx,'IMPLIED',bx,884,PAL.badges.implied,'left')+14;
      drawTypeBadge(ctx,'FAN THEORY',bx,884,PAL.badges.theory,'left');
      ctx.restore();
    }
  }

  /* ---- EGG -> ARCEUS reveal (8.65 - 22.65) ---- */
  if(t>=8.65 && t<22.65){
    ctx.save();
    const z=1+0.05*norm(t,8.65,20);
    ctx.translate(960,470); ctx.scale(z,z); ctx.translate(-960,-470);
    if(t<17.82){
      const crackP=easeInOutCubic(norm(t,16.5,17.8));
      ctx.save();
      if(t>17.55){ const ms=(t-17.55)/0.27; ctx.translate(Math.sin(ms*40)*2.2*(1-ms),Math.cos(ms*34)*1.8*(1-ms)); }
      drawEgg(ctx,960,430,easeOutQuart(norm(t,8.85,10.0)),t,[11.2,13.9],crackP);
      ctx.restore();
    }
    if(t>=17.82 && t<=19.15){
      const sw=easeOutExpo(norm(t,17.82,19.15));
      ctx.save(); ctx.globalAlpha*=(1-norm(t,17.82,19.15))*0.85;
      ctx.strokeStyle=PAL.goldBright; ctx.lineWidth=lerp(12,2,sw);
      ctx.beginPath(); ctx.arc(960,430,60+sw*640,0,Math.PI*2); ctx.stroke();
      ctx.restore();
      for(let i=0;i<26;i++){
        const ang=(i/26)*Math.PI*2+0.3, life=easeOutExpo(norm(t,17.82,19.1));
        const dist=life*(180+(i%5)*46);
        ctx.save(); ctx.globalAlpha*=(1-life)*0.85;
        ctx.fillStyle=i%3?PAL.goldBright:'#FFF3C4';
        ctx.beginPath(); ctx.arc(960+Math.cos(ang)*dist,430+Math.sin(ang)*dist*0.8,3.4,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
    }
    if(t>=18.15){
      const u=easeInOutCubic(norm(t,21.65,22.65));
      const ax=lerp(960,1335,u), ay=lerp(445,555,u), asz=lerp(500,530,u);
      drawHeroArt(ctx,IMG['493'],ax,ay,asz,PAL.gold,t,norm(t,17.82,18.35),0,'astrolabe',PAL.goldVivid);
    }
    ctx.restore();
    const kickA=norm(t,8.9,9.7)*(1-norm(t,17.3,17.9));
    if(kickA>0.01){
      ctx.save(); ctx.globalAlpha*=kickA;
      ctx.font='700 44px "Barlow", sans-serif';
      const tw=ctx.measureText("SINNOH'S OLDEST MYTHOLOGY").width;
      ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.fillStyle=PAL.gold;
      ctx.fillText("SINNOH'S OLDEST MYTHOLOGY",960,648);
      const rw=210*easeOutCubic(norm(t,9.2,10.2));
      ctx.fillRect(960-tw/2-26-rw,635,rw,3);
      ctx.fillRect(960+tw/2+26,635,rw,3);
      ctx.restore();
    }
    const headA=norm(t,13.5,14.3)*(1-norm(t,17.3,17.9));
    if(headA>0.01){
      const slide=lerp(20,0,easeOutQuart(norm(t,13.5,14.3)));
      ctx.save(); ctx.globalAlpha*=headA;
      drawEditorialCard(ctx,620,692+slide,680,122,PAL.gold,headA);
      ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.font='800 96px "Barlow Condensed", sans-serif'; ctx.fillStyle=PAL.offWhite;
      ctx.fillText('CHAOS & AN EGG',960,692+slide+86);
      ctx.restore();
    }
    const plateA=norm(t,20.6,21.1)*(1-norm(t,21.65,22.0));
    if(plateA>0.01){
      ctx.save(); ctx.globalAlpha*=plateA;
      ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.font='800 96px "Barlow Condensed", sans-serif'; ctx.fillStyle=PAL.offWhite;
      ctx.fillText('ARCEUS',960,772);
      ctx.font='600 40px "Barlow", sans-serif'; ctx.fillStyle=PAL.gold;
      ctx.fillText('THE ORIGINAL ONE',960,820);
      ctx.restore();
    }
  }

  /* ---- ARCEUS hero stage (22.15 - 41.5) ---- */
  if(t>=22.15 && t<41.5){
    const enter=easeOutQuart(norm(t,22.15,22.65));
    const z=1.05+0.03*norm(t,22.65,41.3)+0.02*Math.sin(Math.PI*norm(t,33.8,35.4));
    ctx.save(); ctx.translate(960,540); ctx.scale(z,z); ctx.translate(-960,-540);
    if(t>=22.65){
      const par=14*norm(t,22.65,41.3);
      /* volumetric god-rays behind Arceus (slow rotating corona) */
      ctx.save(); ctx.globalCompositeOperation='lighter';
      ctx.translate(1335+par,555); ctx.rotate(t*0.03);
      for(let i=0;i<10;i++){
        const a=(i/10)*Math.PI*2 + Math.sin(t*0.3+i)*0.02;
        const len=430+50*Math.sin(t*0.5+i*1.9);
        const g=ctx.createLinearGradient(0,0,Math.cos(a)*len,Math.sin(a)*len);
        g.addColorStop(0,'rgba(255,216,77,0.055)'); g.addColorStop(1,'rgba(255,216,77,0)');
        ctx.fillStyle=g;
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(a-0.05)*len,Math.sin(a-0.05)*len);
        ctx.lineTo(Math.cos(a+0.05)*len,Math.sin(a+0.05)*len);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      fxPulseRings(PAL.goldVivid,55,220)(ctx,t,1335+par,555);
      if(t>=33.8 && t<35.0){
        ctx.save(); ctx.strokeStyle=hexA(PAL.gold,(1-(t-33.8)/1.2)*0.5); ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(1335+par,555,(t-33.8)*420,0,Math.PI*2); ctx.stroke(); ctx.restore();
      }
      /* escalation burst filling the old quiet stretch (34.9-36.3) */
      if(t>=34.9 && t<36.3){
        const bp=easeOutExpo(norm(t,34.9,36.3));
        ctx.save(); ctx.strokeStyle=hexA(PAL.goldVivid,(1-bp)*0.65); ctx.lineWidth=3.5;
        ctx.beginPath(); ctx.arc(1335+par,555,40+bp*430,0,Math.PI*2); ctx.stroke(); ctx.restore();
        for(let i=0;i<22;i++){
          const ang=(i/22)*Math.PI*2+0.7, dist=bp*(150+(i%5)*52);
          ctx.save(); ctx.globalAlpha*=(1-bp)*0.9;
          ctx.fillStyle=i%3?PAL.goldVivid:PAL.goldHot;
          ctx.beginPath(); ctx.arc(1335+par+Math.cos(ang)*dist,555+Math.sin(ang)*dist*0.82,3.2,0,Math.PI*2); ctx.fill();
          ctx.restore();
        }
      }
      drawHeroArt(ctx,IMG['493'],1335+par,555,530,PAL.gold,t,1,0,'astrolabe',PAL.goldVivid);
      drawFgMotes(ctx,t,'#FFE9A8',0.85);
    }
    drawSplitCard(ctx,t,{
      x:165+(1-enter)*-36, y:300, h:372, accent:PAL.gold, alpha:enter,
      name:'ARCEUS', sub:'THE ORIGINAL ONE', fact:'CREATOR OF THE UNIVERSE', factDy:344,
      badges:[['NORMAL','normal']], badgesWExtra:14+badgeWidth(ctx,'MYTHICAL'),
      emblem:drawArceusEmblem,
      classPill:(c,bx,by,tt)=>{
        if(tt>=26.2 && tt<28.4){
          const a=norm(tt,26.2,26.7)*(1-norm(tt,27.9,28.4));
          const jx=(tt>=27.5&&tt<28.1)?Math.sin(tt*70)*2.5:0;
          c.save(); c.globalAlpha*=a;
          const w=drawTypeBadge(c,'LEGENDARY',bx+jx,by,PAL.badges.implied,'left');
          if(tt>=27.5){
            const sp=easeOutCubic(norm(tt,27.5,28.1));
            c.strokeStyle=PAL.crimsonSpec; c.lineWidth=6; c.lineCap='round';
            c.beginPath(); c.moveTo(bx+10,by+56);
            c.lineTo(bx+10+(w-20)*sp,by+56-44*sp); c.stroke();
          }
          c.restore();
        }
        if(tt>=28.4){
          const a=norm(tt,28.4,28.85);
          c.save(); c.globalAlpha*=a;
          if(tt<29.5){
            const rp=easeOutCubic(norm(tt,28.46,29.5));
            c.strokeStyle=hexA(PAL.gold,(1-rp)*0.6); c.lineWidth=3;
            c.beginPath(); c.arc(bx+86,by+34,24+rp*52,0,Math.PI*2); c.stroke();
          }
          drawTypeBadge(c,'MYTHICAL',bx,by,PAL.badges.canon,'left');
          c.restore();
        }
      },
      chipLine:(c,tx,y,tt)=>{
        const a=norm(tt,31.2,31.6); if(a<=0.01) return;
        c.save(); c.globalAlpha*=a;
        c.font='600 40px "Barlow", sans-serif'; c.fillStyle=PAL.gold;
        c.textAlign='left'; c.textBaseline='alphabetic';
        c.fillText('EVENT-ONLY CATEGORY',tx,y+296);
        if(tt<32.1){
          const rp=easeOutCubic(norm(tt,31.2,32.1));
          c.strokeStyle=hexA(PAL.gold,(1-rp)*0.55); c.lineWidth=2.5;
          c.beginPath(); c.arc(tx+8,y+282,10+rp*40,0,Math.PI*2); c.stroke();
        }
        c.restore();
      }
    });
    ctx.restore();
    const qA=norm(t,36.5,37.05)*(1-norm(t,41.0,41.45));
    if(qA>0.01){
      const qx=140+lerp(-24,0,easeOutQuart(norm(t,36.5,37.05)));
      ctx.save(); ctx.globalAlpha*=qA;
      drawEditorialCard(ctx,qx,690,900,172,PAL.gold,qA);
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      ctx.font='700 40px "Barlow", sans-serif'; ctx.fillStyle=PAL.offWhite;
      ctx.fillText('“IT IS TOLD IN MYTHOLOGY THAT THIS POKÉMON',qx+36,754);
      ctx.fillText('WAS BORN BEFORE THE UNIVERSE EVEN EXISTED.”',qx+36,802);
      ctx.textAlign='right';
      ctx.font=BADGE_FONT; ctx.fillStyle=PAL.gold;
      ctx.fillText('— PEARL POKÉDEX',qx+900-36,848);
      ctx.restore();
    }
  }

  /* ---- MAP2: creation of the trio (41.5 - 47.3) ---- */
  if(t>=41.5 && t<47.3){
    ctx.save();
    let z=lerp(1.12,1.0,easeInOutCubic(norm(t,41.5,42.7)));
    let cxp=960, cyp=430;
    if(t>42.7){ z=lerp(z,1.05,easeInOutCubic(norm(t,42.7,46.8))); }
    if(t>46.8){
      const uz=easeInOutCubic(norm(t,46.8,47.3));
      z=lerp(z,1.55,uz); cxp=lerp(960,430,uz); cyp=lerp(430,545,uz);
    }
    ctx.translate(960,540); ctx.scale(z,z); ctx.translate(-cxp,-cyp);
    drawMap2(ctx,t);
    ctx.restore();
  }

  /* ---- TRIO stages with clip wipes (47.3 - 61.15) ---- */
  if(t>=47.3 && t<50.73){
    drawDialgaStage(ctx,t);
  } else if(t>=50.73 && t<50.98){
    /* curtain wipe: BOTH stages clipped to their own side of the edge —
       stages are transparent overlays, so clipping only the incoming one
       leaves the outgoing card visible through it (dual-card ghosting).
       With dual clips every pixel belongs to exactly one stage. */
    const edgeX=lerp(-60,1980,easeInOutCubic(norm(t,50.73,50.98)));
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,Math.max(0,edgeX),H); ctx.clip();
    drawPalkiaStage(ctx,t);
    ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(Math.min(edgeX,W),0,Math.max(0,W-edgeX),H); ctx.clip();
    drawDialgaStage(ctx,t);
    ctx.restore();
    const grd=ctx.createLinearGradient(edgeX-16,0,edgeX+16,0);
    grd.addColorStop(0,'rgba(75,200,232,0)'); grd.addColorStop(0.5,'rgba(220,245,255,0.95)');
    grd.addColorStop(1,'rgba(224,86,155,0)');
    ctx.fillStyle=grd; ctx.fillRect(edgeX-16,0,32,H);
  } else if(t>=50.98 && t<54.11){
    drawPalkiaStage(ctx,t);
  } else if(t>=54.11 && t<54.36){
    /* rift wipe: Giratina clipped INTO the tear band, Palkia clipped to the
       band's complement (evenodd) — dual clip, zero cross-stage bleed */
    const hw=lerp(0,1600,easeOutCubic(norm(t,54.11,54.36)));
    const band=bandPoly(hw);
    const traceBand=()=>{
      ctx.moveTo(band.L[0].x,band.L[0].y);
      for(let i=1;i<band.L.length;i++) ctx.lineTo(band.L[i].x,band.L[i].y);
      for(let i=band.R.length-1;i>=0;i--) ctx.lineTo(band.R[i].x,band.R[i].y);
      ctx.closePath();
    };
    ctx.save(); ctx.beginPath(); traceBand(); ctx.clip();
    drawGiratinaStage(ctx,t,'stage');
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,W,H); traceBand(); ctx.clip('evenodd');
    drawPalkiaStage(ctx,t);
    ctx.restore();
    ctx.save(); ctx.strokeStyle=PAL.crimsonSpec; ctx.lineWidth=3;
    ctx.shadowColor=PAL.crimson; ctx.shadowBlur=14;
    [band.L,band.R].forEach(pts=>{
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke();
    });
    ctx.restore();
  } else if(t>=54.36 && t<61.15){
    drawGiratinaStage(ctx,t);
  }

  /* ---- lake-guardian tease (61.15 - 62.25): Giratina fully cleared first ---- */
  if(t>=61.15){
    /* ghost map: nodes + threads ONLY (zero text labels, so nothing can
       collide with the guardian row) and every node at blackout */
    ctx.save(); ctx.globalAlpha*=0.22*norm(t,61.15,61.45);
    mapThreads(ctx,t,'dim');
    drawMedallionBase(ctx,MAP.apex.x,MAP.apex.y,72,PAL.gold,t,1);
    drawNodeSilhouette(ctx,MAP.apex.x,MAP.apex.y,72,'493',PAL.goldVivid,t,1);
    drawMedallionBase(ctx,MAP.dialga.x,MAP.dialga.y,56,PAL.cyan,t,0.9);
    drawNodeSilhouette(ctx,MAP.dialga.x,MAP.dialga.y,56,'483',PAL.cyanVivid,t,0.9);
    drawMedallionBase(ctx,MAP.palkia.x,MAP.palkia.y,56,PAL.magenta,t,0.9);
    drawNodeSilhouette(ctx,MAP.palkia.x,MAP.palkia.y,56,'484',PAL.magentaVivid,t,0.9);
    drawMedallionBase(ctx,MAP.giratina.x,MAP.giratina.y,56,PAL.crimson,t,0.9);
    drawNodeSilhouette(ctx,MAP.giratina.x,MAP.giratina.y,56,'487',PAL.crimsonVivid,t,0.9);
    ctx.restore();
    /* guardians: BLACKED-OUT silhouettes with per-guardian rim rings;
       row reseated at cy=832 so medallion bottoms (870) stay < 880 */
    const trio=[[640,'480','UXIE',PAL.goldVivid],[950,'481','MESPRIT',PAL.magentaVivid],[1260,'482','AZELF',PAL.cyanSpec]];
    trio.forEach(([tx,img,nm,acc],i)=>{
      const a=norm(t,61.30+i*0.13,61.58+i*0.13);
      if(a<=0.01) return;
      drawMedallionBase(ctx,tx,832,38,acc,t,a);
      drawNodeSilhouette(ctx,tx,832,38,img,acc,t,a);
      ctx.save(); ctx.globalAlpha*=a;
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      ctx.font='800 40px "Barlow Condensed", sans-serif'; ctx.fillStyle=PAL.offWhite;
      ctx.fillText(nm,tx+54,845);
      ctx.restore();
    });
  }

  ctx.restore(); /* shake */

  drawBloom(ctx,t,8.65,PAL.gold);
  drawBloom(ctx,t,17.9,PAL.goldVivid);
  drawBloom(ctx,t,41.5,PAL.gold);
  drawBloom(ctx,t,46.85,PAL.goldVivid);
  drawBloom(ctx,t,47.3,PAL.cyan);

  const vg=ctx.createRadialGradient(960,540,420,960,540,1150);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.38)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  drawGrain(ctx,t);
  drawHUD(ctx,t);
}
/* ---- deterministic timeline drive (HyperFrames seek contract) ---- */
const state={t:0};
function draw(){ renderScene(state.t); }
const tl=gsap.timeline();
tl.to(state,{t:DUR,duration:DUR,ease:'none',onUpdate:draw},0);
window.__timelines=window.__timelines||{};
window.__timelines['main']=tl;
draw();
</script>
