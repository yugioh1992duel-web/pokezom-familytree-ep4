'use strict';
/* =====================================================================
   POKEZOM Ep.4 v2 — HYBRID ENGINE TEST SLICE (episode 00:50-01:50)
   All motion is a PURE FUNCTION of timeline time t (deterministic,
   seekable). No requestAnimationFrame, no CSS animations.
   Visual system ported from the user's showcase:
   pokezom_ep_4_motion_graphics_showcase_branch_i.html
   ===================================================================== */
const W = 1920, H = 1080;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

['493','483','484','487','480','481','482'].forEach(n => { IMG[n] = document.getElementById('art' + n); });

const PAL = {
  bgDeep:'#0B0D12', plate:'#17181D', plate2:'#1E1E24', offWhite:'#EDEDED',
  silver:'#B4BCC6', gold:'#E6B84C', goldBright:'#F4D58D', goldSpec:'#FFD000',
  cyan:'#4BC8E8', cyanSpec:'#38BDF8', magenta:'#E0569B', crimson:'#E53946',
  crimsonSpec:'#FF3B5C', violet:'#7E3AF2',
  badges:{
    normal:{bg:'#D4D2C5',fg:'#121212',border:'#EAE8DC'},
    steel:{bg:'#B8C2CC',fg:'#121212',border:'#D7E0E8'},
    dragon:{bg:'#4F3A9E',fg:'#EDEDED',border:'#7560C4'},
    water:{bg:'#2B6CB0',fg:'#EDEDED',border:'#4E8FD4'},
    ghost:{bg:'#533A7B',fg:'#EDEDED',border:'#7B5DA8'},
    psychic:{bg:'#C94F7C',fg:'#EDEDED',border:'#E87EA3'},
    canon:{bg:'#2C1B12',fg:'#E6B84C',border:'#E6B84C'},
    implied:{bg:'#23262D',fg:'#EDEDED',border:'#B4BCC6'},
    theory:{bg:'#1D1430',fg:'#C4A6F5',border:'#7E3AF2'},
    banish:{bg:'#2A1115',fg:'#EDEDED',border:'#E53946'}
  }
};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const norm=(t,s,e)=>clamp((t-s)/(e-s),0,1);
const easeOutCubic=x=>1-Math.pow(1-x,3);
const easeInOutCubic=x=>(x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2);
const easeOutQuart=x=>1-Math.pow(1-x,4);
const easeOutExpo=x=>(x===1?1:1-Math.pow(2,-10*x));
const power3InOut = easeInOutCubic;
function cubicBezierPoint(p0,p1,p2,p3,t){
  const u=1-t,tt=t*t,uu=u*u,uuu=uu*u,ttt=tt*t;
  return {x:uuu*p0.x+3*uu*t*p1.x+3*u*tt*p2.x+ttt*p3.x,
          y:uuu*p0.y+3*uu*t*p1.y+3*u*tt*p2.y+ttt*p3.y};
}
function createSeededRandom(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}

/* ---- deterministic particle fields (showcase seed & counts) ---- */
const rand = createSeededRandom(40125);
const embers = Array.from({length:85},(_,i)=>({
  x:rand()*W, y:rand()*H, radius:1.4+rand()*3.2, speedY:10+rand()*24,
  driftX:(rand()-0.5)*18, phase:rand()*Math.PI*2, alpha:0.16+rand()*0.48,
  isCrimson:i%4===0
}));
const stars = Array.from({length:150},()=>({
  x:rand()*W, y:rand()*H, r:0.8+rand()*1.7, phase:rand()*Math.PI*2, tw:0.5+rand()*1.6
}));
const shards = Array.from({length:16},(_,i)=>{
  const angle=(i/16)*Math.PI*2+(rand()-0.5)*0.3;
  return { baseX:1300+Math.cos(angle)*(240+rand()*290), baseY:560+Math.sin(angle)*(85+rand()*95),
    size:16+rand()*26, rot:rand()*Math.PI*2, rotSpeed:(rand()-0.5)*0.5,
    bobAmp:8+rand()*14, phase:rand()*Math.PI*2, sides:3+Math.floor(rand()*3),
    rimColor:i%2===0?PAL.crimson:PAL.violet };
});

/* ---- drawing primitives (ported from showcase) ---- */
function drawRoundedRect(c,x,y,w,h,r){
  const radius=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+radius,y); c.lineTo(x+w-radius,y); c.quadraticCurveTo(x+w,y,x+w,y+radius);
  c.lineTo(x+w,y+h-radius); c.quadraticCurveTo(x+w,y+h,x+w-radius,y+h);
  c.lineTo(x+radius,y+h); c.quadraticCurveTo(x,y+h,x,y+h-radius);
  c.lineTo(x,y+radius); c.quadraticCurveTo(x,y,x+radius,y); c.closePath();
}
/* Type/verification pill — font locked at 32px JetBrains Mono, height 52. Returns width. */
function drawTypeBadge(c,text,x,y,styleObj,align='left'){
  c.save();
  c.font='700 32px "JetBrains Mono", monospace';
  const metrics=c.measureText(text);
  const padX=22, pillW=Math.ceil(metrics.width+padX*2), pillH=52;
  const drawX=align==='center'?x-pillW/2:align==='right'?x-pillW:x;
  drawRoundedRect(c,drawX,y,pillW,pillH,12);
  c.fillStyle=styleObj.bg; c.fill();
  c.lineWidth=2.5; c.strokeStyle=styleObj.border; c.stroke();
  c.fillStyle=styleObj.fg; c.textAlign='center'; c.textBaseline='middle';
  c.fillText(text,drawX+pillW/2,y+pillH/2+1);
  c.restore();
  return pillW;
}
/* Obsidian glass editorial card: gradient plate, 1px metallic rim (accent @ .35), accent bar. */
function drawEditorialCard(c,x,y,w,h,accentColor,alpha=1){
  c.save(); c.globalAlpha*=alpha;
  c.shadowColor='rgba(0,0,0,0.72)'; c.shadowBlur=32; c.shadowOffsetY=12;
  drawRoundedRect(c,x,y,w,h,16);
  const grad=c.createLinearGradient(x,y,x+w,y+h);
  grad.addColorStop(0,'#1B1D23'); grad.addColorStop(1,'#131418');
  c.fillStyle=grad; c.fill();
  c.shadowColor='transparent'; c.shadowBlur=0; c.shadowOffsetY=0;
  c.lineWidth=2; c.strokeStyle=hexA(accentColor,0.35); c.stroke();
  drawRoundedRect(c,x,y+14,7,h-28,4); c.fillStyle=accentColor; c.fill();
  c.restore();
}
function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
/* Glowing medallion base with rotating dashed astrolabe ring (showcase port). */
function drawMedallionBase(c,cx,cy,r,accentColor,t,alpha=1){
  c.save(); c.globalAlpha*=alpha;
  const aura=c.createRadialGradient(cx,cy,r*0.25,cx,cy,r*2.15);
  aura.addColorStop(0,hexA(accentColor,0.33)); aura.addColorStop(0.55,hexA(accentColor,0.09));
  aura.addColorStop(1,'rgba(11,13,18,0)');
  c.fillStyle=aura; c.beginPath(); c.arc(cx,cy,r*2.15,0,Math.PI*2); c.fill();
  c.save(); c.translate(cx,cy); c.rotate(t*0.25);
  c.strokeStyle=hexA(accentColor,0.47); c.lineWidth=2.5; c.setLineDash([12,10]);
  c.beginPath(); c.arc(0,0,r+13,0,Math.PI*2); c.stroke(); c.setLineDash([]); c.restore();
  const coreGrad=c.createRadialGradient(cx-r*0.25,cy-r*0.25,r*0.1,cx,cy,r);
  coreGrad.addColorStop(0,'#23252E'); coreGrad.addColorStop(1,'#121317');
  c.fillStyle=coreGrad; c.beginPath(); c.arc(cx,cy,r,0,Math.PI*2); c.fill();
  c.lineWidth=3.5; c.strokeStyle=accentColor; c.stroke();
  c.lineWidth=1.5; c.strokeStyle='rgba(237,237,237,0.18)';
  c.beginPath(); c.arc(cx,cy,r-8,0,Math.PI*2); c.stroke();
  c.restore();
}
/* Circular-clipped official art inside a medallion (map nodes). */
function drawNodeArt(c,img,cx,cy,r,alpha=1,dim=0){
  c.save(); c.globalAlpha*=alpha;
  c.beginPath(); c.arc(cx,cy,r-6,0,Math.PI*2); c.clip();
  if(dim>0){ c.fillStyle=`rgba(8,9,13,${dim})`; }
  const s=(r-6)*2;
  c.drawImage(img,cx-s/2,cy-s/2,s,s);
  if(dim>0){ c.fillRect(cx-r,cy-r,r*2,r*2); }
  c.restore();
}
/* Hero-stage official art: volumetric rim glow, rotating ring, gentle bob — pure f(t). */
function drawHeroArt(c,img,cx,cy,size,accent,t,alpha=1,phase=0){
  c.save(); c.globalAlpha*=alpha;
  const bobY=Math.sin(t*0.9+phase)*7;
  const breathe=1+0.012*Math.sin(t*0.7+phase);
  const yy=cy+bobY, ss=size*breathe;
  const aura=c.createRadialGradient(cx,yy,size*0.1,cx,yy,size*1.05);
  aura.addColorStop(0,hexA(accent,0.42)); aura.addColorStop(0.55,hexA(accent,0.14));
  aura.addColorStop(1,'rgba(11,13,18,0)');
  c.fillStyle=aura; c.beginPath(); c.arc(cx,yy,size*1.05,0,Math.PI*2); c.fill();
  c.save(); c.translate(cx,yy); c.rotate(t*0.18);
  c.strokeStyle=hexA(accent,0.5); c.lineWidth=3; c.setLineDash([16,12]);
  c.beginPath(); c.arc(0,0,size*0.60,0,Math.PI*2); c.stroke(); c.setLineDash([]); c.restore();
  c.strokeStyle=hexA(accent,0.85); c.lineWidth=2.5;
  c.beginPath(); c.arc(cx,yy,size*0.565,0,Math.PI*2); c.stroke();
  c.save();
  c.shadowColor='rgba(0,0,0,0.65)'; c.shadowBlur=30; c.shadowOffsetY=16;
  c.drawImage(img,cx-ss/2,yy-ss/2,ss,ss);
  c.restore();
  c.restore();
}
/* Animated cubic Bezier lineage thread with traveling pulses (showcase port). */
function drawLineageThread(c,p0,p1,p2,p3,color,progress,t,alpha=1){
  if(progress<=0.001) return;
  c.save(); c.globalAlpha*=alpha;
  const steps=48, maxStep=Math.floor(steps*progress);
  c.beginPath();
  for(let i=0;i<=maxStep;i++){
    const pt=cubicBezierPoint(p0,p1,p2,p3,i/steps);
    if(i===0)c.moveTo(pt.x,pt.y); else c.lineTo(pt.x,pt.y);
  }
  c.strokeStyle=hexA(color,0.27); c.lineWidth=10; c.lineCap='round'; c.stroke();
  c.strokeStyle=color; c.lineWidth=3.2; c.stroke();
  if(progress<0.99){
    const head=cubicBezierPoint(p0,p1,p2,p3,progress);
    c.fillStyle='#EDEDED'; c.shadowColor=color; c.shadowBlur=18;
    c.beginPath(); c.arc(head.x,head.y,6,0,Math.PI*2); c.fill(); c.shadowBlur=0;
  }
  if(progress>0.35){
    for(let p=0;p<2;p++){
      const pulseT=(t*0.42+p*0.5)%1;
      if(pulseT<=progress){
        const pt=cubicBezierPoint(p0,p1,p2,p3,pulseT);
        const grad=c.createRadialGradient(pt.x,pt.y,1,pt.x,pt.y,18);
        grad.addColorStop(0,'#EDEDED'); grad.addColorStop(0.35,color); grad.addColorStop(1,'rgba(0,0,0,0)');
        c.fillStyle=grad; c.beginPath(); c.arc(pt.x,pt.y,18,0,Math.PI*2); c.fill();
      }
    }
  }
  c.restore();
}
/* Fractured crimson/violet rift polyline (showcase port, jitter = f(t)). */
function drawFracturedRift(c,points,progress,t,alpha=1){
  if(progress<=0.001) return;
  c.save(); c.globalAlpha*=alpha;
  const segLens=[]; let totalLen=0;
  for(let i=1;i<points.length;i++){
    const len=Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y);
    segLens.push(len); totalLen+=len;
  }
  const targetLen=totalLen*progress;
  const buildPath=(jitterAmp)=>{
    c.beginPath(); c.moveTo(points[0].x,points[0].y);
    let acc=0;
    for(let i=1;i<points.length;i++){
      const len=segLens[i-1];
      const jx=i<points.length-1?Math.sin(t*24+i*3.1)*jitterAmp:0;
      const jy=i<points.length-1?Math.cos(t*21+i*2.7)*jitterAmp:0;
      if(acc+len<=targetLen){ c.lineTo(points[i].x+jx,points[i].y+jy); acc+=len; }
      else{
        const rem=clamp((targetLen-acc)/len,0,1);
        c.lineTo(lerp(points[i-1].x,points[i].x,rem)+jx*rem, lerp(points[i-1].y,points[i].y,rem)+jy*rem);
        break;
      }
    }
  };
  buildPath(2.4); c.strokeStyle='rgba(126,58,242,0.42)'; c.lineWidth=14; c.lineJoin='miter'; c.lineCap='round'; c.stroke();
  buildPath(1.4); c.strokeStyle=PAL.crimson; c.lineWidth=4.2; c.stroke();
  buildPath(0.8); c.strokeStyle='#F9B4BA'; c.lineWidth=1.6; c.stroke();
  c.restore();
}

/* ---- vector emblems (showcase ports, used as card/map accents) ---- */
function drawArceusEmblem(c,cx,cy,scale,t,alpha=1){
  c.save(); c.globalAlpha*=alpha; c.translate(cx,cy); c.scale(scale,scale);
  c.strokeStyle=PAL.gold; c.lineWidth=4.5;
  c.beginPath(); c.arc(0,0,34,0,Math.PI*2); c.stroke();
  c.fillStyle=PAL.goldBright;
  for(let i=0;i<4;i++){
    c.save(); c.rotate((i*Math.PI)/2);
    c.beginPath(); c.moveTo(0,-48); c.lineTo(8,-14); c.lineTo(0,-6); c.lineTo(-8,-14); c.closePath(); c.fill(); c.restore();
  }
  const pulse=0.78+0.22*Math.sin(t*3.5);
  for(let i=0;i<4;i++){
    const ang=(i*Math.PI)/2+Math.PI/4, jx=Math.cos(ang)*34, jy=Math.sin(ang)*34;
    c.fillStyle='#34D399'; c.globalAlpha=alpha*pulse;
    c.beginPath(); c.arc(jx,jy,4.5,0,Math.PI*2); c.fill();
    c.globalAlpha=alpha; c.strokeStyle=PAL.goldBright; c.lineWidth=2; c.stroke();
  }
  c.fillStyle='#121212'; c.strokeStyle=PAL.gold; c.lineWidth=3;
  c.beginPath(); c.moveTo(0,-11); c.lineTo(11,0); c.lineTo(0,11); c.lineTo(-11,0); c.closePath(); c.fill(); c.stroke();
  c.restore();
}
function drawDialgaEmblem(c,cx,cy,scale,t,alpha=1){
  c.save(); c.globalAlpha*=alpha; c.translate(cx,cy); c.scale(scale,scale);
  c.strokeStyle=PAL.cyan; c.lineWidth=3.5;
  c.beginPath(); c.arc(0,0,38,0,Math.PI*2); c.stroke();
  for(let i=0;i<12;i++){
    const ang=(i/12)*Math.PI*2, inner=i%3===0?27:31;
    c.strokeStyle=i%3===0?'#EDEDED':PAL.cyan; c.lineWidth=i%3===0?3:2;
    c.beginPath(); c.moveTo(Math.cos(ang)*inner,Math.sin(ang)*inner);
    c.lineTo(Math.cos(ang)*37,Math.sin(ang)*37); c.stroke();
  }
  c.strokeStyle='#EDEDED'; c.lineWidth=3.2; c.lineCap='round';
  c.beginPath(); c.moveTo(0,0);
  c.lineTo(Math.cos(t*0.8-Math.PI/2)*23,Math.sin(t*0.8-Math.PI/2)*23); c.stroke();
  c.strokeStyle=PAL.cyan; c.lineWidth=2.4;
  c.beginPath(); c.moveTo(0,0);
  c.lineTo(Math.cos(t*2.8-Math.PI/2)*30,Math.sin(t*2.8-Math.PI/2)*30); c.stroke();
  c.fillStyle=PAL.cyan;
  c.beginPath(); c.moveTo(0,-12); c.lineTo(9,0); c.lineTo(0,12); c.lineTo(-9,0); c.closePath(); c.fill();
  c.strokeStyle='#EDEDED'; c.lineWidth=2; c.stroke();
  c.restore();
}
function drawPalkiaEmblem(c,cx,cy,scale,t,alpha=1){
  c.save(); c.globalAlpha*=alpha; c.translate(cx,cy); c.scale(scale,scale);
  const ringAngles=[0.45+t*0.25,-0.45-t*0.2,Math.PI/2+t*0.15];
  ringAngles.forEach((ang,idx)=>{
    c.save(); c.rotate(ang);
    c.strokeStyle=idx===0?PAL.magenta:idx===1?'#F294C3':'rgba(237,237,237,0.65)';
    c.lineWidth=idx===2?2.2:3.2;
    c.beginPath(); c.ellipse(0,0,40,15,0,0,Math.PI*2); c.stroke(); c.restore();
  });
  const pearl=c.createRadialGradient(-4,-4,2,0,0,14);
  pearl.addColorStop(0,'#FFF0F6'); pearl.addColorStop(0.55,PAL.magenta); pearl.addColorStop(1,'#751D4A');
  c.fillStyle=pearl; c.beginPath(); c.arc(0,0,13,0,Math.PI*2); c.fill();
  c.strokeStyle='#EDEDED'; c.lineWidth=2; c.stroke();
  c.restore();
}
function drawGiratinaEmblem(c,cx,cy,scale,t,alpha=1){
  c.save(); c.globalAlpha*=alpha; c.translate(cx,cy); c.scale(scale,scale);
  c.strokeStyle=PAL.violet; c.lineWidth=2.5;
  c.beginPath(); c.arc(0,0,36,0,Math.PI*2); c.stroke();
  c.fillStyle=PAL.gold; c.strokeStyle='#121212'; c.lineWidth=2;
  [-1,1].forEach(dir=>{
    c.save(); c.scale(dir,1);
    c.beginPath(); c.moveTo(5,-6); c.quadraticCurveTo(28,-14,38,-36);

    c.beginPath(); c.moveTo(8,12); c.lineTo(31,20); c.lineTo(14,29); c.closePath(); c.fill(); c.stroke();
    c.restore();
  });
  c.fillStyle='#17181E'; c.strokeStyle=PAL.gold; c.lineWidth=2.5;
  c.beginPath(); c.moveTo(0,-24); c.lineTo(15,-4); c.lineTo(10,22); c.lineTo(0,32);
  c.lineTo(-10,22); c.lineTo(-15,-4); c.closePath(); c.fill(); c.stroke();
  const eyeGlow=0.8+0.2*Math.sin(t*6);
  c.fillStyle=PAL.crimson; c.shadowColor=PAL.crimson; c.shadowBlur=12*eyeGlow;
  c.beginPath(); c.moveTo(-10,-2); c.lineTo(-3,2); c.lineTo(-9,6); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(10,-2); c.lineTo(3,2); c.lineTo(9,6); c.closePath(); c.fill();
  c.restore();
}
/* Cosmic Egg (showcase port): astrolabe rings + golden bezier shell. */
function drawAstrolabeRing(c,cx,cy,radius,speed,dash,color,lineW,nodes,t){
  c.save(); c.translate(cx,cy); c.rotate(t*speed);
  c.strokeStyle=color; c.lineWidth=lineW;
  if(dash)c.setLineDash(dash);
  c.beginPath(); c.arc(0,0,radius,0,Math.PI*2); c.stroke(); c.setLineDash([]);
  for(let k=0;k<nodes;k++){
    const a=(k/nodes)*Math.PI*2;
    c.fillStyle=k%2===0?PAL.goldBright:'#EDEDED';
    c.beginPath(); c.arc(Math.cos(a)*radius,Math.sin(a)*radius,k%2===0?4:2.5,0,Math.PI*2); c.fill();
  }
  c.restore();
}
function drawEgg(c,cx,cy,appear,t){
  c.save();
  const glow=c.createRadialGradient(cx,cy,18,cx,cy,260);
  glow.addColorStop(0,'rgba(230,184,76,0.42)'); glow.addColorStop(0.5,'rgba(230,184,76,0.10)');
  glow.addColorStop(1,'rgba(11,13,18,0)');
  c.fillStyle=glow; c.beginPath(); c.arc(cx,cy,260,0,Math.PI*2); c.fill();
  drawAstrolabeRing(c,cx,cy,142*appear,0.35,[18,14],'rgba(230,184,76,0.65)',2.5,8,t);
  drawAstrolabeRing(c,cx,cy,186*appear,-0.22,[6,12],'rgba(237,237,237,0.25)',2.0,12,t);
  drawAstrolabeRing(c,cx,cy,226*appear,0.14,null,'rgba(230,184,76,0.18)',2.0,4,t);
  c.save(); c.translate(cx,cy);
  const pulse = 1 + 0.10*Math.exp(-Math.pow(t-16.38,2)/0.08); /* heartbeat pulse as VO names the egg (ep 66.38) */
  const eggScale=(0.72+0.28*appear)*(1+0.025*Math.sin(t*3.2))*pulse;
  c.scale(eggScale,eggScale);
  c.beginPath();
  c.moveTo(0,-104);
  c.bezierCurveTo(64,-104,84,-14,74,48);
  c.bezierCurveTo(66,94,34,112,0,112);
  c.bezierCurveTo(-34,112,-66,94,-74,48);
  c.bezierCurveTo(-84,-14,-64,-104,0,-104);
  c.closePath();
  const shellGrad=c.createRadialGradient(-22,-32,10,0,10,125);

/* ---- background: obsidian vignette, grid, starfield, embers (pure f(t)) ---- */
function drawBackground(c,t){
  const crimsonTint=easeOutCubic(norm(t,53.0,54.6));
  const bgGrad=c.createRadialGradient(960,480,120,960,540,1180);
  bgGrad.addColorStop(0,crimsonTint>0.01?'#1E171B':'#1C1D23');
  bgGrad.addColorStop(0.55,'#141720'); bgGrad.addColorStop(1,'#0B0D12');
  c.fillStyle=bgGrad; c.fillRect(0,0,W,H);
  c.save();
  c.strokeStyle='rgba(237,237,237,0.028)'; c.lineWidth=2;
  for(let gx=160;gx<W;gx+=160){ c.beginPath(); c.moveTo(gx,0); c.lineTo(gx,H); c.stroke(); }
  for(let gy=135;gy<H;gy+=135){ c.beginPath(); c.moveTo(0,gy); c.lineTo(W,gy); c.stroke(); }
  c.restore();
  c.save();
  for(const s of stars){
    const tw=0.35+0.65*(0.5+0.5*Math.sin(t*s.tw+s.phase));
    c.globalAlpha=0.5*tw; c.fillStyle='#DDE6F2';
    c.beginPath(); c.arc(s.x,s.y,s.r,0,Math.PI*2); c.fill();
  }
  c.restore();
  c.save();
  const crimsonAll = t>=53.0;
  for(const p of embers){
    const py=(p.y - t*p.speedY + H*4)%H;
    const px=(p.x + Math.sin(t*0.7+p.phase)*26 + t*p.driftX + W*4)%W;
    const twinkle=0.55+0.45*Math.sin(t*2.4+p.phase);
    c.globalAlpha=p.alpha*twinkle;
    c.fillStyle=(p.isCrimson||crimsonAll&&p.isCrimson)?PAL.crimson:PAL.goldBright;
    if(crimsonAll && p.isCrimson) c.fillStyle=PAL.crimson;
    c.beginPath(); c.arc(px,py,p.radius,0,Math.PI*2); c.fill();
  }
  c.restore();
}

/* expanding pulse rings (Arceus gold / Dialga cyan time rings) */
function fxPulseRings(color,speed,spacing){
  return (c,t,cx,cy)=>{
    c.save();
    for(let k=0;k<3;k++){
      const r=((t*speed+k*spacing)%330);
      const a=(1-r/330)*0.34;
      if(a<=0) continue;
      c.strokeStyle=hexA(color,a); c.lineWidth=2.5;
      c.beginPath(); c.arc(cx,cy,r,0,Math.PI*2); c.stroke();
    }
    c.restore();
  };
}
function fxDialga(c,t,cx,cy){
  fxPulseRings(PAL.cyan,95,165)(c,t,cx,cy);
  c.save(); c.translate(cx,cy); c.rotate(t*0.1);
  c.strokeStyle=hexA(PAL.cyan,0.4); c.lineWidth=3;
  for(let i=0;i<12;i++){
    const a=(i/12)*Math.PI*2;
    c.beginPath();
    c.moveTo(Math.cos(a)*318,Math.sin(a)*318);
    c.lineTo(Math.cos(a)*336,Math.sin(a)*336); c.stroke();
  }
  c.restore();
}
function fxPalkia(c,t,cx,cy){
  c.save(); c.translate(cx,cy);
  [0.45+t*0.22,-0.45-t*0.18,Math.PI/2+t*0.13].forEach((ang,idx)=>{
    c.save(); c.rotate(ang);
    c.strokeStyle=idx===0?hexA(PAL.magenta,0.55):idx===1?'rgba(242,148,195,0.4)':'rgba(237,237,237,0.3)';
    c.lineWidth=3;
    c.beginPath(); c.ellipse(0,0,365,132,0,0,Math.PI*2); c.stroke(); c.restore();
  });
  c.restore();
  fxPulseRings(PAL.magenta,70,220)(c,t,cx,cy);
}
function fxArceus(c,t,cx,cy){
  c.save(); c.translate(cx,cy); c.rotate(-t*0.05);
  c.strokeStyle='rgba(230,184,76,0.16)'; c.lineWidth=2; c.setLineDash([10,16]);
  c.beginPath(); c.arc(0,0,345,0,Math.PI*2); c.stroke(); c.setLineDash([]);
  c.restore();
  fxPulseRings(PAL.gold,55,220)(c,t,cx,cy);
}
/* Giratina stage VFX: rift tear + shards (art center 1300,555) */
const RIFT_PTS=[{x:1300,y:170},{x:1282,y:250},{x:1318,y:330},{x:1290,y:410},{x:1302,y:480},{x:1252,y:560},{x:1202,y:545},{x:1150,y:640},{x:1100,y:632},{x:1052,y:720}];
function fxGiratina(c,t,cx,cy){
  const flash=(1-norm(t,54.25,54.95))*0.26;
  if(flash>0.003){
    c.save(); c.globalAlpha*=flash;
    const vGrad=c.createRadialGradient(1250,540,80,1250,540,860);
    vGrad.addColorStop(0,PAL.crimson); vGrad.addColorStop(0.6,PAL.violet); vGrad.addColorStop(1,'rgba(11,13,18,0)');
    c.fillStyle=vGrad; c.fillRect(0,0,W,H); c.restore();
  }
  const shardsIn=easeOutCubic(norm(t,54.2,55.4));
  if(shardsIn>0.01){
    for(const sh of shards){
      const sx=sh.baseX+Math.cos(t*0.65+sh.phase)*14;
      const sy=sh.baseY+Math.sin(t*1.1+sh.phase)*sh.bobAmp;
      c.save(); c.globalAlpha*=shardsIn*0.72;
      c.translate(sx,sy); c.rotate(sh.rot+t*sh.rotSpeed);
      c.beginPath();
      for(let v=0;v<sh.sides;v++){
        const a=(v/sh.sides)*Math.PI*2, rad=sh.size*(v%2===0?1:0.62);
        const vx=Math.cos(a)*rad, vy=Math.sin(a)*rad;
        if(v===0)c.moveTo(vx,vy); else c.lineTo(vx,vy);
      }
      c.closePath(); c.fillStyle='#15151C'; c.fill();
      c.lineWidth=2; c.strokeStyle=sh.rimColor+'AA'; c.stroke();
      c.restore();
    }
  }
  drawFracturedRift(c,RIFT_PTS,easeOutQuart(norm(t,54.0,54.9)),t,1);
}

function renderScene(t){
  drawBackground(ctx,t);
  /* damped camera shake on the banishment/rift beat (showcase: 350ms) */
  let shX=0, shY=0;
  if(t>=54.25 && t<=54.60){
    const st=(t-54.25)/0.35, decay=Math.exp(-st*6.5);
    shX=Math.sin(st*Math.PI*11)*14*decay;
    shY=Math.cos(st*Math.PI*9)*10*decay;
  }
  ctx.save();

  /* ---- MAP1: cold-open constellation (0 - 8.7) ---- */
  if(t<8.75){
    const a=1-norm(t,7.9,8.7);

    ctx.save(); ctx.globalAlpha*=sceneA;
    const z=1+0.05*norm(t,8,20);
    ctx.translate(960,470); ctx.scale(z,z); ctx.translate(-960,-470);
    if(t<18.55){
      const eggA=(1-norm(t,17.82,18.5));

      ctx.restore();
    }
    if(t>=17.82 && t<=19.15){

    const headA=norm(t,13.4,14.3)*(1-norm(t,17.3,17.9));

      ctx.save();
      drawRoundedRect(ctx,430,682,1060,174,18);
      ctx.fillStyle='rgba(18,19,23,0.84)'; ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle='rgba(230,184,76,0.28)'; ctx.stroke();

    ctx.save(); ctx.globalAlpha*=1-outX; ctx.translate(-90*outX,0);
    const z=1+0.045*(1-easeInOutCubic(norm(t,45.51,46.66)))+0.018*norm(t,45.51,49.6);
    ctx.translate(960,540); ctx.scale(z,z); ctx.translate(-960,-540);
    drawHeroStage(ctx,t,{
      img:IMG['483'], accent:PAL.cyan, name:'DIALGA', sub:'WHOSE HEARTBEAT IS TIME ITSELF',
      badges:[['STEEL','steel'],['DRAGON','dragon']], fact:'CONTROLS THE FLOW OF TIME',
      emblem:drawDialgaEmblem, artSide:'right', start:45.51, fx:fxDialga
    });
    ctx.restore();
  }

  /* ---- PALKIA hero stage (49.63 - 53.51) ---- */
  if(t>=49.6 && t<53.55){
    const inX=norm(t,49.63,50.13), outX=norm(t,53.01,53.51);
    ctx.save(); ctx.globalAlpha*=inX*(1-outX); ctx.translate(90*(1-inX)-70*outX,0);
    const z=1+0.045*(1-easeInOutCubic(norm(t,49.63,50.78)))+0.018*norm(t,49.63,53.0);
    ctx.translate(960,540); ctx.scale(z,z); ctx.translate(-960,-540);
    drawHeroStage(ctx,t,{
      img:IMG['484'], accent:PAL.magenta, name:'PALKIA', sub:'HOLDS SPACE TOGETHER BY BREATHING',
      badges:[['WATER','water'],['DRAGON','dragon']], fact:'STABILIZES THE FABRIC OF SPACE',
      emblem:drawPalkiaEmblem, artSide:'left', start:49.63, fx:fxPalkia
    });
    ctx.restore();
  }

  /* ---- end tease backdrop: map ghost (58.9 - 60) ---- */
  if(t>=58.9){
    ctx.save(); ctx.globalAlpha*=0.20*norm(t,58.9,60.0);
    drawMap(ctx,t,'dim');
    ctx.restore();
  }

  /* ---- GIRATINA hero stage (53.01 - 60.0) ---- */
  if(t>=53.0){
    const inX=norm(t,53.01,53.51);
    ctx.save(); ctx.globalAlpha*=inX;
    const pullback=1-0.035*norm(t,58.9,60.0);
    const z=(1+0.045*(1-easeInOutCubic(norm(t,53.01,54.16)))+0.018*norm(t,53.01,58.9))*pullback;
    ctx.translate(960,540); ctx.scale(z,z); ctx.translate(-960,-540);
    drawHeroStage(ctx,t,{
      img:IMG['487'], accent:PAL.crimson, name:'GIRATINA', sub:'MASTER OF ANTIMATTER',
      badges:[['GHOST','ghost'],['DRAGON','dragon'],['ANTIMATTER','banish']],
      fact:'RULER OF THE DISTORTION WORLD',
      emblem:drawGiratinaEmblem, artSide:'right', start:53.01, fx:fxGiratina
    });
    ctx.restore();
    /* lake guardians tease */
    const teaseA=norm(t,59.0,59.7);
    if(teaseA>0.01){
      const trio=[[640,IMG['480'],'UXIE'],[950,IMG['481'],'MESPRIT'],[1260,IMG['482'],'AZELF']];
      for(const [tx,img,nm] of trio){
        drawMedallionBase(ctx,tx,792,38,PAL.gold,t,teaseA);
        drawNodeArt(ctx,img,tx,792,38,teaseA,0.35);
        ctx.save(); ctx.globalAlpha*=teaseA;
        ctx.textAlign='left'; ctx.textBaseline='alphabetic';
        ctx.font='800 36px "Barlow Condensed", sans-serif'; ctx.fillStyle=PAL.offWhite;
        ctx.fillText(nm,tx+54,805);
        ctx.restore();
      }
    }
  }

  ctx.restore(); /* shake */

  /* vignette */
  const vg=ctx.createRadialGradient(960,540,420,960,540,1150);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.38)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  drawHUD(ctx,t);
}
/* ---- deterministic timeline drive (HyperFrames seek contract) ---- */
const state={t:0};
function draw(){ renderScene(state.t); }
const tl=gsap.timeline();
tl.to(state,{t:60,duration:60,ease:'none',onUpdate:draw},0);
window.__timelines=window.__timelines||{};
window.__timelines['main']=tl;
draw();
</script>
